<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragrance UZ Boutique</title>
<script>try{var t=localStorage.getItem('fragranceuz-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){}</script>
<style>body{margin:0;background:#f6efe4}:root[data-theme=dark] body{background:#140c0c}.b-demo{display:none!important}</style>
</head>
<body><div id="root"></div><script type="module" src="./entry.tsx"></script></body>
</html>
